resolver 127.0.0.11 valid=10s ipv6=off;
upstream eiqas_gateway {
    zone eiqas_gateway 64k;
    server gateway:8001 resolve;
}
upstream eiqas_frontend {
    zone eiqas_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 2026;
    server_name localhost;
    client_max_body_size 64m;
    location /api/langgraph/ {
        proxy_pass http://eiqas_gateway/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://eiqas_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://eiqas_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
